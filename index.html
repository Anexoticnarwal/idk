<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Tracker</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Style for the expandable content sections */
        .details-container {
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out;
            overflow: hidden; 
        }
        .details-container.expanded {
            max-height: 2500px; /* Increased max-height to handle forms and steps */
            opacity: 1;
            padding-top: 0.5rem; 
        }
        /* Custom focus ring for form elements */
        .form-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5); /* blue-500 equivalent ring */
            border-color: #3b82f6;
        }
        /* Style for the step completion checkbox (making it look good) */
        .toggle-step {
            accent-color: #059669; /* emerald-600 */
        }
        /* Keyframe for a satisfying completion animation */
        @keyframes highlight-complete {
            0% { background-color: rgba(5, 150, 105, 0.1); } /* emerald-100 */
            100% { background-color: transparent; }
        }
        .animate-complete {
            animation: highlight-complete 0.6s ease-out;
        }
    </style>
</head>
<body class="min-h-screen">

    <main class="max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <!-- Minimal Header -->
        <h1 class="text-xl font-semibold text-gray-800 mb-4">Goal Tracker</h1>

        <!-- FILTER AND SORT CONTROLS (Compact) -->
        <div class="bg-white p-3 rounded-xl shadow-md mb-6 flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3 items-end border border-gray-100 text-sm">
            <!-- Filter Column -->
            <div class="w-full sm:w-1/2">
                <label for="status-filter" class="block text-xs font-medium text-gray-500 mb-0.5">Filter by Status</label>
                <select id="status-filter" class="form-input w-full p-1.5 border border-gray-300 rounded-lg text-sm transition duration-150" onchange="applyFilters()">
                    <option value="all">All Goals</option>
                    <option value="active">Active</option>
                    <option value="completed">Completed (100%)</option>
                </select>
            </div>
            
            <!-- Sort Column -->
            <div class="w-full sm:w-1/2">
                <label for="sort-by" class="block text-xs font-medium text-gray-500 mb-0.5">Sort By</label>
                <select id="sort-by" class="form-input w-full p-1.5 border border-gray-300 rounded-lg text-sm transition duration-150" onchange="applyFilters()">
                    <option value="progress-desc">Progress (Highest First)</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="start-date-asc">Start Date (Earliest First)</option>
                    <option value="target-date-asc">Target Date (Earliest First)</option>
                </select>
            </div>
        </div>

        <!-- GOALS LIST CONTAINER -->
        <div id="goals-list" class="space-y-6 mb-10">
            <!-- Goals will be dynamically inserted here -->
        </div>
        
        <!-- GOAL CREATION FORM -->
        <div id="add-goal-container" class="bg-white p-4 rounded-2xl shadow-xl border border-gray-100">
            <div class="flex justify-between items-center mb-1 pb-1 border-b">
                <h2 class="text-xl font-bold text-gray-800">New Goal</h2>
                <button
                    id="toggle-add-form"
                    type="button"
                    class="p-1 text-gray-600 hover:text-blue-600 rounded-full transition duration-150"
                    aria-label="Toggle Form"
                >
                    <svg class="w-6 h-6 rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
            </div>
            
            <div id="add-goal-form-content" class="details-container expanded">
                <form id="add-goal-form">
                    
                    <!-- Goal Name Input -->
                    <div class="mb-3">
                        <label for="goal-name" class="block text-sm font-medium text-gray-700 mb-1">Goal Name</label>
                        <input id="goal-name" type="text" placeholder="e.g., Launch New Project" class="form-input w-full p-2 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition duration-150" required />
                    </div>
                    
                    <!-- Goal Dates Input -->
                    <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 mb-3">
                        <div class="w-full sm:w-1/2">
                            <label for="goal-start" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                            <input id="goal-start" type="date" class="goal-date form-input w-full p-2 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition duration-150 text-sm" />
                        </div>
                        <div class="w-full sm:w-1/2">
                            <label for="goal-end" class="block text-sm font-medium text-gray-700 mb-1">Target Date</label>
                            <input id="goal-end" type="date" class="goal-date form-input w-full p-2 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition duration-150 text-sm" />
                        </div>
                    </div>

                    <!-- Tasks Drafting Section -->
                    <div class="p-3 bg-gray-50 rounded-xl shadow-inner border border-gray-200">
                        <div id="tasks-draft-container" class="details-container expanded"> 
                            <p class="text-xs font-semibold text-gray-600 mb-2">Tasks to include in the new goal:</p>
                            <!-- Drafted Steps List -->
                            <ul id="steps-draft-list" class="space-y-1 max-h-40 overflow-y-auto pr-2 mb-2">
                                <!-- Steps will be dynamically inserted here -->
                            </ul>

                            <!-- New Step Input Group -->
                            <div class="space-y-2 pt-1 border-t border-gray-200">
                                <!-- Task Description Input -->
                                <div>
                                    <label for="new-step-desc" class="block text-sm font-medium text-gray-700 mb-1">Task Description</label>
                                    <input id="new-step-desc" type="text" placeholder="e.g., Finalize design mockups" class="form-input w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500 transition duration-150" />
                                </div>
                                
                                <!-- TASK DATES: Side-by-side -->
                                <div class="flex space-x-3">
                                    <div class="w-1/2">
                                        <label for="new-step-start-date" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                                        <input id="new-step-start-date" type="date" class="step-date form-input w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500 transition duration-150" />
                                    </div>
                                    <div class="w-1/2">
                                        <label for="new-step-end-date" class="block text-sm font-medium text-gray-700 mb-1">Target Date</label>
                                        <input id="new-step-end-date" type="date" class="step-date form-input w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500 transition duration-150" />
                                    </div>
                                </div>

                                <!-- Recurring Checkbox -->
                                <div class="flex items-center pt-1">
                                    <input id="new-step-recurring" type="checkbox" class="h-4 w-4 text-emerald-600 rounded focus:ring-emerald-500 border-gray-300 toggle-step" />
                                    <label for="new-step-recurring" class="ml-2 block text-sm font-medium text-gray-700">
                                        Daily Recurring Task
                                    </label>
                                </div>

                                <button type="button" id="add-step-draft-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium text-sm py-2 rounded-xl transition duration-200 shadow-md">
                                    Add Task
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Notes Section -->
                    <div class="p-3 bg-gray-50 rounded-xl shadow-inner border border-gray-200 mt-3">
                        <button type="button" id="toggle-notes" class="w-full text-left flex justify-between items-center text-sm font-bold text-gray-700 hover:text-blue-600 transition duration-150" aria-expanded="false">
                            <span>Notes</span>
                            <svg class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div id="notes-container" class="details-container">
                            <textarea id="goal-notes" rows="3" placeholder="Context or key resources..." class="form-input w-full p-2 border border-gray-300 rounded-xl text-sm focus:ring-blue-500 focus:border-blue-500 transition duration-150"></textarea>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-lg py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-300/50 mt-4">
                        CREATE GOAL
                    </button>
                </form>
            </div>
        </div>
        
        <!-- MESSAGE BOX (Replaces showStatusMessage for better UX) -->
        <div id="message-box" class="fixed bottom-4 right-4 bg-emerald-500 text-white p-3 rounded-lg shadow-xl transition-all duration-300 opacity-0 transform translate-y-4 pointer-events-none" role="status">
            Success!
        </div>

        <!-- CONFIRMATION MODAL -->
        <div id="confirmation-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 p-4" aria-modal="true" role="dialog">
            <div id="modal-content" class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6" role="document">
                <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-4"></h3>
                <p id="modal-message" class="text-gray-600 mb-6"></p>
                <div class="flex justify-end space-x-3">
                    <button id="modal-cancel-btn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition duration-150">
                        Cancel
                    </button>
                    <button id="modal-confirm-btn" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition duration-150 shadow-md">
                        Confirm
                    </button>
                </div>
            </div>
        </div>

        <!-- EDIT GOAL MODAL (New Modal for editing Goal Name/Dates) -->
        <div id="edit-goal-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 p-4" aria-modal="true" role="dialog">
            <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6" role="document">
                <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Edit Goal Details</h3>
                <form id="edit-goal-form">
                    <input type="hidden" id="edit-goal-id">

                    <div class="mb-4">
                        <label for="edit-goal-name" class="block text-sm font-medium text-gray-700 mb-1">Goal Name</label>
                        <input id="edit-goal-name" type="text" class="form-input w-full p-2 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition duration-150" required />
                        <p id="edit-name-error" class="text-red-500 text-xs mt-1 hidden">Goal name cannot be empty.</p>
                    </div>

                    <div class="flex space-x-3 mb-6">
                        <div class="w-1/2">
                            <label for="edit-goal-start" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                            <input id="edit-goal-start" type="date" class="edit-goal-date form-input w-full p-2 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition duration-150 text-sm" />
                        </div>
                        <div class="w-1/2">
                            <label for="edit-goal-end" class="block text-sm font-medium text-gray-700 mb-1">Target Date</label>
                            <input id="edit-goal-end" type="date" class="edit-goal-date form-input w-full p-2 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition duration-150 text-sm" />
                        </div>
                    </div>
                    <p id="edit-date-error" class="text-red-500 text-sm mb-4 hidden -mt-4">Target Date must be after the Start Date.</p>

                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="hideEditModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition duration-150">
                            Cancel
                        </button>
                        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition duration-150 shadow-md">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="max-w-4xl mx-auto px-4 py-4 text-center text-xs text-gray-400 border-t mt-8">
        Goal Tracker Enhanced - No APIs Used
    </footer>

    <script>
        // --- DATA MANAGEMENT (LOCAL STORAGE) ---
        const LOCAL_STORAGE_KEY = 'goalTrackerDataV2'; // Updated key for potential data model changes
        let goals = [];
        let stepsDraft = [];
        let currentFilter = 'all';
        let currentSort = 'progress-desc';

        // Custom validation function to check if date1 is before date2
        const isDateBefore = (date1, date2) => {
            if (!date1 || !date2) return true; // Allow empty dates
            return new Date(date1) <= new Date(date2);
        };

        /**
         * Loads goals from local storage or initializes an empty array.
         */
        const loadGoals = () => {
            const data = localStorage.getItem(LOCAL_STORAGE_KEY);
            goals = data ? JSON.parse(data) : [];
            // Calculate and store initial progress for each goal (needed for filtering/sorting)
            goals.forEach(goal => {
                goal.progress = calculateProgress(goal).progressPercent;
            });
        };

        /**
         * Saves the current goals array to local storage.
         */
        const saveGoals = (message = 'Goal updated successfully!') => {
            // Re-calculate progress before saving/rendering
            goals.forEach(goal => {
                goal.progress = calculateProgress(goal).progressPercent;
            });
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(goals));
            showStatusMessage(message); 
            applyFilters(); // Re-render with current filters/sort
        };

        /**
         * Generates a unique ID (simple UUID v4 replacement).
         */
        const generateId = () => {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        };

        /**
         * Formats a date string to DD/MM/YYYY.
         * @param {string} dateString - Date in YYYY-MM-DD format.
         * @returns {string} Formatted date or 'N/A'.
         */
        const formatDate = (dateString) => {
            if (!dateString) return 'N/A';
            try {
                const parts = dateString.split('-');
                if (parts.length === 3) {
                    return `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
                return dateString;
            } catch {
                return dateString;
            }
        };

        /**
         * Returns today's date as a YYYY-MM-DD string.
         * @returns {string} 
         */
        const getTodayDateString = () => {
            return new Date().toISOString().slice(0, 10);
        };

        /**
         * Shows a temporary status message in a fixed notification box.
         * @param {string} message 
         * @param {string} colorClass - Tailwind color class (e.g., 'bg-emerald-500')
         */
        const showStatusMessage = (message, colorClass = 'bg-emerald-500') => {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = message;
            msgBox.className = `fixed bottom-4 right-4 text-white p-3 rounded-lg shadow-xl transition-all duration-300 opacity-100 transform translate-y-0 pointer-events-auto ${colorClass}`;

            setTimeout(() => {
                msgBox.className = `fixed bottom-4 right-4 text-white p-3 rounded-lg shadow-xl transition-all duration-300 opacity-0 transform translate-y-4 pointer-events-none ${colorClass}`;
            }, 3000);
        };

        // --- FILTERING AND SORTING ---

        /**
         * Applies the selected filter and sort criteria to the goals list and renders.
         */
        const applyFilters = () => {
            currentFilter = document.getElementById('status-filter').value;
            currentSort = document.getElementById('sort-by').value;

            let filteredGoals = goals;

            // 1. Filtering
            if (currentFilter === 'active') {
                filteredGoals = goals.filter(g => g.progress < 100);
            } else if (currentFilter === 'completed') {
                filteredGoals = goals.filter(g => g.progress === 100);
            }

            // 2. Sorting
            filteredGoals.sort((a, b) => {
                switch (currentSort) {
                    case 'name-asc':
                        return a.name.localeCompare(b.name);
                    case 'start-date-asc':
                        return (a.startDate || '9999-12-31').localeCompare(b.startDate || '9999-12-31');
                    case 'target-date-asc':
                        return (a.endDate || '9999-12-31').localeCompare(b.endDate || '9999-12-31');
                    case 'progress-desc':
                    default:
                        return b.progress - a.progress;
                }
            });

            renderGoals(filteredGoals);
        };


        // --- GOAL RENDERING ---

        /**
         * Calculates the progress percentage for a goal and the daily completion count.
         * @param {object} goal - The goal object.
         * @returns {{progressPercent: number, completedToday: number, totalSteps: number, isCompleted: boolean}} The progress metrics.
         */
        const calculateProgress = (goal) => {
            const totalSteps = goal.steps.length;
            const today = getTodayDateString();
            
            if (totalSteps === 0) return { progressPercent: 0, completedToday: 0, totalSteps: 0, isCompleted: false };

            const completedToday = goal.steps.reduce((count, step) => {
                const isStepCompleted = step.isRecurring
                    ? (step.completionLog && step.completionLog.includes(today))
                    : step.isCompleted;
                
                return count + (isStepCompleted ? 1 : 0);
            }, 0);

            // Progress is calculated based on completed steps today / total steps
            const progressPercent = Math.round((completedToday / totalSteps) * 100);
            const isCompleted = progressPercent === 100;

            return { progressPercent, completedToday, totalSteps, isCompleted };
        };

        /**
         * Renders the entire list of goals based on the filtered list.
         * @param {Array<object>} displayGoals - The list of goals to display.
         */
        const renderGoals = (displayGoals) => {
            const goalsListContainer = document.getElementById('goals-list');
            goalsListContainer.innerHTML = ''; // Clear existing content

            if (displayGoals.length === 0) {
                const filterText = currentFilter === 'all' ? 'found in your tracker.' : `matching the status "${currentFilter}".`;
                goalsListContainer.innerHTML = `
                    <div class="text-center p-12 bg-white rounded-xl shadow-lg border-4 border-dashed border-gray-300">
                        <p class="text-xl font-semibold text-gray-600">No Goals ${filterText}</p>
                        <p class="mt-2 text-gray-500">Try creating a new goal or adjusting your filter/sort settings.</p>
                    </div>
                `;
                return;
            }

            displayGoals.forEach(goal => {
                const goalElement = createGoalElement(goal);
                goalsListContainer.appendChild(goalElement);
            });
        };

        /**
         * Toggles a nested details container.
         * @param {HTMLElement} button - The button element that was clicked.
         * @param {string} contentId - The ID of the details-container to toggle.
         */
        const handleToggleNestedDetails = (button, contentId) => {
            const content = document.getElementById(contentId);
            const svg = button.querySelector('svg');
            
            if (!content || !svg) return;

            const isExpanded = content.classList.toggle('expanded');
            svg.classList.toggle('rotate-180', isExpanded);
            button.setAttribute('aria-expanded', isExpanded);
        };


        /**
         * Creates the full HTML element for a single goal.
         * @param {object} goal - The goal object.
         * @returns {HTMLElement} The goal element.
         */
        const createGoalElement = (goal) => {
            const { progressPercent, completedToday, totalSteps, isCompleted } = calculateProgress(goal);
            const isExpanded = goal.isExpanded || false;
            const today = getTodayDateString();

            // Use Emerald for success (complete) and Blue for in-progress
            const baseColor = isCompleted ? 'emerald' : 'blue';

            const goalDiv = document.createElement('div');
            goalDiv.className = `bg-white shadow-xl rounded-2xl p-4 border-t-4 border-${baseColor}-500 transition-shadow hover:shadow-2xl`;
            goalDiv.setAttribute('data-goal-id', goal.id);

            // --- NOTES/EDITING SECTION ---
            const hasNotes = !!goal.notes;
            const notesContent = hasNotes ? goal.notes : 'No context or key resources added.';
            const notesTextClass = hasNotes ? 'text-gray-700' : 'text-gray-500 italic';
            
            const notesSectionHtml = `
                <div class="p-3 bg-gray-50 rounded-xl shadow-inner border border-gray-200 mt-3">
                    <button
                        type="button" 
                        data-goal-id="${goal.id}"
                        onclick="handleToggleNestedDetails(this, 'goal-notes-content-${goal.id}')"
                        class="w-full text-left flex justify-between items-center text-sm font-bold text-gray-700 hover:text-${baseColor}-600 transition duration-150"
                        aria-expanded="false"
                        title="Toggle Notes Section"
                    >
                        <span>Notes</span>
                        <svg class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    
                    <div id="goal-notes-content-${goal.id}" class="details-container">
                        <div class="pt-2">
                            <h4 class="text-sm font-semibold text-gray-700 flex justify-between items-center mb-1">
                                Goal Notes
                                <button
                                    data-goal-id="${goal.id}"
                                    data-is-editing="false"
                                    onclick="handleEditNotes(this)"
                                    class="edit-notes-btn text-xs text-${baseColor}-600 hover:text-${baseColor}-800 transition font-medium px-2 py-0.5 rounded-md bg-white hover:bg-gray-100 border border-gray-200"
                                    title="Edit Notes"
                                >
                                    Edit
                                </button>
                            </h4>
                            <div class="notes-display ${notesTextClass} text-sm whitespace-pre-wrap px-1">
                                ${notesContent}
                            </div>
                            <div class="notes-edit hidden mt-2">
                                <textarea
                                    rows="3"
                                    class="notes-textarea w-full p-2 border border-${baseColor}-300 rounded-lg text-sm focus:ring-${baseColor}-500 focus:border-${baseColor}-500 transition duration-150"
                                >${goal.notes || ''}</textarea>
                                <div class="flex justify-end space-x-2 mt-2">
                                    <button
                                        onclick="handleCancelNotes('${goal.id}', this)"
                                        class="px-3 py-1 text-sm font-medium text-gray-700 bg-white rounded-lg hover:bg-gray-100 transition border border-gray-300"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onclick="handleSaveNotes('${goal.id}', this.closest('.notes-edit').querySelector('.notes-textarea').value)"
                                        class="px-3 py-1 text-sm font-medium text-white bg-${baseColor}-600 rounded-lg hover:bg-${baseColor}-700 transition shadow-md"
                                    >
                                        Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            // --- END NOTES SECTION ---


            // Generate Steps List HTML
            const stepsHtml = goal.steps.length > 0
                ? goal.steps.map(step => {
                    const isCompleted = step.isRecurring 
                        ? (step.completionLog && step.completionLog.includes(today)) 
                        : step.isCompleted;

                    const datesHtml = isExpanded && (step.startDate || step.endDate)
                        ? `<span class="text-xs text-gray-400">Start: ${formatDate(step.startDate)} | Target: ${formatDate(step.endDate)}</span>`
                        : '';
                    
                    const recurringTag = step.isRecurring 
                        ? `<span class="text-xs font-semibold text-blue-500 bg-blue-100 px-2 py-0.5 rounded-full ml-2">Daily</span>`
                        : '';

                    return `
                    <li data-step-id="${step.id}" class="step-item flex items-start p-2 bg-gray-50 rounded-lg border border-gray-200 transition duration-100 hover:bg-gray-100 ${isCompleted ? 'animate-complete' : ''}">
                        <input type="checkbox" ${isCompleted ? 'checked' : ''} 
                            onchange="handleToggleStep('${goal.id}', '${step.id}', this.checked)"
                            class="toggle-step h-5 w-5 text-emerald-600 rounded focus:ring-emerald-500 flex-shrink-0 cursor-pointer mt-1 mr-3"
                            title="${step.isRecurring ? 'Mark complete for today' : 'Mark as permanent complete'}" />
                        <div class="text-sm flex-grow min-w-0">
                            <span class="block font-medium ${isCompleted ? 'line-through text-gray-500' : 'text-gray-700'}">
                                ${step.description} ${recurringTag}
                            </span>
                            ${datesHtml}
                        </div>
                    </li>
                `}).join('')
                : '<p class="text-center text-gray-500 italic p-2">No tasks yet. Click "+ Add New Task" to start!</p>';
            
            // --- ADD TASK COLLAPSIBLE FORM ---
            const addTaskSectionHtml = `
                <div class="mb-3 p-3 bg-white rounded-xl space-y-3 shadow-sm border border-gray-200">
                    <button
                        type="button" 
                        data-goal-id="${goal.id}"
                        onclick="handleToggleNestedDetails(this, 'add-task-form-content-${goal.id}')"
                        class="w-full text-left flex justify-between items-center text-base font-bold text-teal-700 hover:text-teal-600 transition duration-150 mb-2 border-b border-gray-100 pb-2"
                        aria-expanded="false"
                        title="Toggle Add Task Form"
                    >
                        <span>+ Add New Task</span>
                        <svg class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    
                    <div id="add-task-form-content-${goal.id}" class="details-container">
                        <div class="space-y-3 pt-1">
                            <!-- Task Description Input -->
                            <div>
                                <label for="new-task-desc-${goal.id}" class="block text-sm font-medium text-gray-700 mb-1">Task Description</label>
                                <input
                                    type="text"
                                    placeholder="e.g., Complete 10 exercises"
                                    id="new-task-desc-${goal.id}"
                                    class="form-input w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-teal-500 focus:border-teal-500 transition duration-150"
                                    required
                                />
                            </div>
                            <!-- TASK DATES: Side-by-side (Inputs use text-sm) -->
                            <div class="flex space-x-3">
                                <div class="w-1/2">
                                    <label for="new-task-start-date-${goal.id}" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                                    <input
                                        type="date"
                                        id="new-task-start-date-${goal.id}"
                                        class="step-date form-input w-full p-2 border border-gray-300 rounded-lg text-sm"
                                        title="Task Start Date"
                                    />
                                </div>
                                <div class="w-1/2">
                                    <label for="new-task-end-date-${goal.id}" class="block text-sm font-medium text-gray-700 mb-1">Target Date</label>
                                    <input
                                        type="date"
                                        id="new-task-end-date-${goal.id}"
                                        class="step-date form-input w-full p-2 border border-gray-300 rounded-lg text-sm"
                                        title="Task Due Date"
                                    />
                                </div>
                            </div>

                            <!-- Recurring Checkbox -->
                            <div class="flex items-center pt-1">
                                <input id="new-task-recurring-${goal.id}" type="checkbox" class="h-4 w-4 text-emerald-600 rounded focus:ring-emerald-500 border-gray-300 toggle-step" />
                                <label for="new-task-recurring-${goal.id}" class="ml-2 block text-sm font-medium text-gray-700">
                                    Daily Recurring Task
                                </label>
                            </div>
                            
                            <!-- Task Add Button -->
                            <button
                                onclick="handleAddStep('${goal.id}')"
                                class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium text-sm py-2 rounded-lg transition duration-200 shadow-md mt-3"
                            >
                                Add Task
                            </button>
                        </div>
                    </div>
                </div>
            `;

            // Conditional "Tasks" header (ONLY VISIBLE WHEN EXPANDED)
            const taskHeaderHtml = isExpanded 
                ? `<h4 class="text-lg font-bold text-gray-700 mb-2">Tasks</h4>`
                : '';

            // Render goal name and dates with Edit Button
            goalDiv.innerHTML = `
                <div class="flex items-start justify-between mb-2">
                    <!-- Goal Name & CONDENSED Edit Icon -->
                    <div class="flex-grow truncate mr-4 flex items-center space-x-2">
                        <h3 class="text-xl font-bold text-gray-800 ${isCompleted ? 'line-through text-gray-500' : ''}">
                            ${goal.name}
                        </h3>
                        <!-- Condensed Edit Button (Pencil Icon) -->
                        <button 
                            onclick="showEditModal('${goal.id}')"
                            class="text-gray-400 hover:text-blue-600 rounded-full transition duration-150 p-1 -mt-1"
                            title="Edit Goal Name and Dates"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                    </div>
                    
                    <!-- Progress Percentage & Completion Status -->
                    <div class="flex items-center space-x-3 flex-shrink-0">
                        <!-- Task Summary added here -->
                        <span class="text-sm font-medium text-gray-500 hidden sm:inline">${completedToday}/${totalSteps} tasks</span>
                        
                        ${isCompleted ? `
                            <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" title="Completed"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span class="text-lg font-extrabold text-emerald-600">100%</span>
                        ` : `
                            <span class="text-lg font-extrabold text-${baseColor}-600">${progressPercent}%</span>
                        `}
                        
                        <!-- Expansion Toggle Icon -->
                        <svg class="w-5 h-5 text-gray-500 transition-transform ${isExpanded ? 'rotate-180' : 'rotate-0'} cursor-pointer" onclick="handleToggleDetails('${goal.id}')" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>

                <!-- Thin Progress Bar beneath the header -->
                <div class="w-full bg-gray-200 rounded-full h-1.5">
                    <div
                        class="h-1.5 rounded-full transition-all duration-500 bg-${baseColor}-500"
                        style="width: ${progressPercent}%"
                        title="${progressPercent}% progress"
                    ></div>
                </div>
                
                <!-- Dates Summary (ALWAYS VISIBLE) -->
                <p class="text-xs text-gray-600 mb-3 font-medium p-2 bg-gray-50 rounded-lg border border-gray-200 mt-3">
                    <span class="font-semibold text-gray-700">Start:</span> ${formatDate(goal.startDate)} | <span class="font-semibold text-gray-700">Target:</span> ${formatDate(goal.endDate)}
                </p>

                <!-- Tasks Header (ONLY VISIBLE WHEN EXPANDED) -->
                ${taskHeaderHtml}
                
                <!-- Steps List (ALWAYS VISIBLE) -->
                <ul class="space-y-2 mb-3 max-h-60 overflow-y-auto pr-1">
                    ${stepsHtml}
                </ul>

                
                <!-- Expanded Content (Now only contains editing/management features) -->
                <div class="goal-details-content details-container ${isExpanded ? 'expanded' : ''}">
                    
                    <!-- 1. Add Step Form (COLLAPSIBLE) -->
                    ${addTaskSectionHtml}
                    
                    <!-- 2. Notes Section (COLLAPSIBLE by default, now matches Add Goal form) -->
                    ${notesSectionHtml}

                    <!-- 3. Delete Button -->
                    <button
                        onclick="showDeleteModal('${goal.id}', '${goal.name}')"
                        class="mt-4 w-full text-red-600 hover:bg-red-50 text-sm font-semibold py-2 rounded-xl transition duration-150 border border-red-300 shadow-sm"
                    >
                        Delete Goal
                    </button>
                </div>
            `;
            return goalDiv;
        };

        // --- HANDLERS (GOAL ACTIONS) ---

        /**
         * Toggles the expanded state of a goal's detail section.
         * @param {string} goalId 
         */
        const handleToggleDetails = (goalId) => {
            const goal = goals.find(g => g.id === goalId);
            if (!goal) return;

            goal.isExpanded = !goal.isExpanded;
            // Re-render only the affected goal (or the whole list for simplicity and consistency with filtering)
            applyFilters();
        };

        /**
         * Toggles the completion status of a step.
         * @param {string} goalId 
         * @param {string} stepId 
         * @param {boolean} isChecked 
         */
        const handleToggleStep = (goalId, stepId, isChecked) => {
            const goal = goals.find(g => g.id === goalId);
            const step = goal?.steps.find(s => s.id === stepId);
            if (!goal || !step) return;

            const today = getTodayDateString();

            if (step.isRecurring) {
                if (!step.completionLog) step.completionLog = [];

                if (isChecked) {
                    if (!step.completionLog.includes(today)) {
                        step.completionLog.push(today);
                    }
                } else {
                    step.completionLog = step.completionLog.filter(d => d !== today);
                }
            } else {
                step.isCompleted = isChecked;
            }

            // Add animation class briefly to the DOM element
            const stepElement = document.querySelector(`.step-item[data-step-id="${stepId}"]`);
            if (stepElement && isChecked) {
                 stepElement.classList.add('animate-complete');
                 setTimeout(() => stepElement.classList.remove('animate-complete'), 700);
            }

            saveGoals('Task status updated!');
        };
        
        /**
         * Adds a new task/step to an existing goal.
         * @param {string} goalId 
         */
        const handleAddStep = (goalId) => {
            const goal = goals.find(g => g.id === goalId);
            if (!goal) return;

            const descInput = document.getElementById(`new-task-desc-${goalId}`);
            const startInput = document.getElementById(`new-task-start-date-${goalId}`);
            const endInput = document.getElementById(`new-task-end-date-${goalId}`);
            const recurringCheckbox = document.getElementById(`new-task-recurring-${goalId}`);

            const description = descInput.value.trim();
            const startDate = startInput.value;
            const endDate = endInput.value;
            const isRecurring = recurringCheckbox.checked;

            if (!description) {
                showStatusMessage('Task description is required.', 'bg-red-500');
                return;
            }
            if (!isDateBefore(startDate, endDate)) {
                showStatusMessage('Task Target Date must be after or same as Start Date.', 'bg-red-500');
                return;
            }

            const newStep = {
                id: generateId(),
                description,
                startDate,
                endDate,
                isRecurring,
                isCompleted: false,
                completionLog: isRecurring ? [] : null
            };

            goal.steps.push(newStep);
            saveGoals('New task added to goal!');

            // Clear inputs
            descInput.value = '';
            startInput.value = '';
            endInput.value = '';
            recurringCheckbox.checked = false;
        };


        // --- DRAFT STEP HANDLERS (For New Goal Form) ---

        /**
         * Renders the temporary list of drafted steps in the Add Goal form.
         */
        const renderDraftSteps = () => {
            const list = document.getElementById('steps-draft-list');
            list.innerHTML = '';
            
            if (stepsDraft.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-gray-400 italic py-2">No tasks added to the draft goal yet.</p>`;
                return;
            }

            stepsDraft.forEach((step, index) => {
                const dates = (step.startDate || step.endDate)
                    ? `<span class="text-xs text-gray-400">Start: ${formatDate(step.startDate)} | Target: ${formatDate(step.endDate)}</span>`
                    : '';
                
                const recurringTag = step.isRecurring 
                    ? `<span class="text-xs font-semibold text-blue-500 bg-blue-100 px-1 py-0.5 rounded-full ml-2">Daily</span>`
                    : '';

                list.innerHTML += `
                    <li class="flex items-center justify-between p-2 bg-white rounded-lg border border-gray-200">
                        <div class="text-sm flex-grow min-w-0 mr-2">
                            <span class="block font-medium text-gray-700 truncate">${step.description} ${recurringTag}</span>
                            ${dates}
                        </div>
                        <button type="button" onclick="removeDraftStep(${index})" class="text-red-500 hover:text-red-700 p-1 rounded-full transition" title="Remove Task">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </li>
                `;
            });
        };

        /**
         * Adds a step from the draft inputs to the stepsDraft array.
         */
        const addDraftStep = () => {
            const descInput = document.getElementById('new-step-desc');
            const startInput = document.getElementById('new-step-start-date');
            const endInput = document.getElementById('new-step-end-date');
            const recurringCheckbox = document.getElementById('new-step-recurring');

            const description = descInput.value.trim();
            const startDate = startInput.value;
            const endDate = endInput.value;
            const isRecurring = recurringCheckbox.checked;

            if (!description) {
                showStatusMessage('Task description is required to add a draft step.', 'bg-red-500');
                return;
            }
            if (!isDateBefore(startDate, endDate)) {
                showStatusMessage('Task Target Date must be after or same as Start Date.', 'bg-red-500');
                return;
            }


            stepsDraft.push({
                id: generateId(), // temp ID for draft removal
                description,
                startDate,
                endDate,
                isRecurring,
                isCompleted: false,
                completionLog: isRecurring ? [] : null
            });

            renderDraftSteps();

            // Clear inputs for the next step
            descInput.value = '';
            startInput.value = '';
            endInput.value = '';
            recurringCheckbox.checked = false;
            descInput.focus();
        };

        /**
         * Removes a step from the stepsDraft array by index.
         * @param {number} index 
         */
        const removeDraftStep = (index) => {
            stepsDraft.splice(index, 1);
            renderDraftSteps();
        };

        // --- FORM SUBMISSION ---

        /**
         * Handles the creation of a new goal from the form.
         * @param {Event} e 
         */
        const handleNewGoalSubmit = (e) => {
            e.preventDefault();
            
            const nameInput = document.getElementById('goal-name');
            const startInput = document.getElementById('goal-start');
            const endInput = document.getElementById('goal-end');
            const notesInput = document.getElementById('goal-notes');

            const goalName = nameInput.value.trim();
            const startDate = startInput.value;
            const endDate = endInput.value;
            const notes = notesInput.value.trim();

            if (!isDateBefore(startDate, endDate)) {
                showStatusMessage('Goal Target Date must be after or same as Start Date.', 'bg-red-500');
                return;
            }

            const newGoal = {
                id: generateId(),
                name: goalName,
                startDate,
                endDate,
                notes,
                steps: [...stepsDraft], // Use a copy of the drafted steps
                isExpanded: true, // Keep new goal expanded by default
                progress: 0 // Will be recalculated in saveGoals
            };

            goals.push(newGoal);
            saveGoals('New goal created successfully!');

            // Reset form and draft
            e.target.reset();
            stepsDraft = [];
            renderDraftSteps();
        };

        // --- EDIT GOAL MODAL HANDLERS ---

        /**
         * Shows the modal for editing goal name and dates.
         * @param {string} goalId 
         */
        const showEditModal = (goalId) => {
            const goal = goals.find(g => g.id === goalId);
            if (!goal) return;

            document.getElementById('edit-goal-id').value = goal.id;
            document.getElementById('edit-goal-name').value = goal.name;
            document.getElementById('edit-goal-start').value = goal.startDate || '';
            document.getElementById('edit-goal-end').value = goal.endDate || '';
            
            document.getElementById('edit-date-error').classList.add('hidden');
            document.getElementById('edit-name-error').classList.add('hidden');
            document.getElementById('edit-goal-modal').classList.remove('hidden');
        };

        /**
         * Hides the edit goal modal.
         */
        const hideEditModal = () => {
            document.getElementById('edit-goal-modal').classList.add('hidden');
        };

        /**
         * Handles the submission of the edit goal form.
         * @param {Event} e 
         */
        const handleEditGoalSubmit = (e) => {
            e.preventDefault();
            
            const goalId = document.getElementById('edit-goal-id').value;
            const newName = document.getElementById('edit-goal-name').value.trim();
            const newStart = document.getElementById('edit-goal-start').value;
            const newEnd = document.getElementById('edit-goal-end').value;

            const nameError = document.getElementById('edit-name-error');
            const dateError = document.getElementById('edit-date-error');
            nameError.classList.add('hidden');
            dateError.classList.add('hidden');

            if (!newName) {
                nameError.classList.remove('hidden');
                return;
            }
            if (!isDateBefore(newStart, newEnd)) {
                dateError.classList.remove('hidden');
                return;
            }
            
            const goal = goals.find(g => g.id === goalId);
            if (goal) {
                goal.name = newName;
                goal.startDate = newStart;
                goal.endDate = newEnd;
                saveGoals('Goal details updated successfully!');
            }

            hideEditModal();
        };

        // --- NOTES HANDLERS ---
        
        const handleEditNotes = (button) => {
            const goalId = button.getAttribute('data-goal-id');
            const goalDiv = button.closest('.goal-details-content');

            if (!goalDiv) return;

            const display = goalDiv.querySelector('.notes-display');
            const edit = goalDiv.querySelector('.notes-edit');
            
            display.classList.add('hidden');
            edit.classList.remove('hidden');
            button.textContent = 'Editing...';
            button.setAttribute('disabled', 'true');
        };

        const handleCancelNotes = (goalId, button) => {
            const goalDiv = button.closest('.goal-details-content');
            if (!goalDiv) return;

            const display = goalDiv.querySelector('.notes-display');
            const edit = goalDiv.querySelector('.notes-edit');
            const editBtn = goalDiv.querySelector('.edit-notes-btn');

            display.classList.remove('hidden');
            edit.classList.add('hidden');
            editBtn.textContent = 'Edit';
            editBtn.removeAttribute('disabled');
        };

        const handleSaveNotes = (goalId, newNotes) => {
            const goal = goals.find(g => g.id === goalId);
            if (!goal) return;

            goal.notes = newNotes;
            saveGoals('Notes saved.');
        };


        // --- DELETE MODAL HANDLERS ---
        let deleteGoalId = null;

        const showDeleteModal = (goalId, goalName) => {
            deleteGoalId = goalId;
            document.getElementById('modal-title').textContent = `Confirm Deletion`;
            document.getElementById('modal-message').textContent = `Are you sure you want to delete the goal: "${goalName}"? This action cannot be undone.`;
            document.getElementById('confirmation-modal').classList.remove('hidden');
        };

        const hideDeleteModal = () => {
            document.getElementById('confirmation-modal').classList.add('hidden');
            deleteGoalId = null;
        };

        const deleteGoal = () => {
            if (deleteGoalId) {
                goals = goals.filter(g => g.id !== deleteGoalId);
                saveGoals('Goal deleted successfully!');
                hideDeleteModal();
            }
        };

        // --- INITIALIZATION ---

        window.onload = () => {
            loadGoals();
            applyFilters(); // Initial render with default sorting/filtering
            renderDraftSteps(); // Initial render for new goal form

            // Attach event listeners
            document.getElementById('add-goal-form').addEventListener('submit', handleNewGoalSubmit);
            document.getElementById('add-step-draft-btn').addEventListener('click', addDraftStep);
            
            document.getElementById('edit-goal-form').addEventListener('submit', handleEditGoalSubmit);

            document.getElementById('modal-cancel-btn').addEventListener('click', hideDeleteModal);
            document.getElementById('modal-confirm-btn').addEventListener('click', deleteGoal);

            // Toggle handlers for main form sections
            document.getElementById('toggle-add-form').addEventListener('click', function() {
                handleToggleNestedDetails(this, 'add-goal-form-content');
            });
            document.getElementById('toggle-notes').addEventListener('click', function() {
                handleToggleNestedDetails(this, 'notes-container');
            });
        };
    </script>
</body>
</html>
